name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: go vet ./...
      - run: go test ./...
      - run: node --test web/
      - name: Page checks (lint, jsdom, Chromium)
        if: matrix.os == 'ubuntu-latest'
        working-directory: tools/webtest
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npm run e2e
          npm run a11y
