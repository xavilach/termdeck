[project]
name = "termdeck"
version = "0.1.0"
description = "SSH and serial terminal with saved profiles: TUI, CLI, web and desktop UIs on one core"
readme = "README.md"
authors = [
    { name = "xavilach", email = "50375556+xavilach@users.noreply.github.com" }
]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "asyncssh>=2.24.1",
    "bcrypt>=5.0.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
tui = [
    "pyte>=0.8.2",
    "textual>=8.2.8",
]
web = [
    "aiohttp>=3.14.5",
]
gui = [
    "aiohttp>=3.14.5",
    "pywebview>=6.2.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cairosvg>=2.9.1",
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[project.scripts]
termdeck = "termdeck.cli:main"
